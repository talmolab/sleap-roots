# species / mode / age-window -> sleap_roots Pipeline subclass.
#
# Ported from the legacy salk-tm/sleap-roots-traits pipeline_chooser_table.csv, with the
# enumerated age lists (e.g. "2, 3, 4, 5") converted to contiguous inclusive
# [age_min, age_max] windows (mirroring predict's ModelCard age windows). Selection only
# resolves the class; whether a pipeline supports one-row scan-grain emission is guarded
# separately (see compatibility.check_pipeline_compatible).
#
# The wheat and sorghum rows are not from the legacy table: their pipeline classes match
# past hpi_dev production runs (talmolab/sleap-roots#276). Wheat's model labels all seminal
# roots, including the primary, as crown, so wheat runs crown-only OlderMonocotPipeline. Their windows must equal the predict model
# cards' windows in talmolab/sleap-roots-training#72; nothing checks that across repos.
#
# Ages above a species + mode's highest window match that window (bloom#971); see
# pipeline_chooser.past_window_age.
- species: soybean
  mode: cylinder
  age_min: 2
  age_max: 8
  pipeline_class: DicotPipeline
- species: canola
  mode: cylinder
  age_min: 2
  age_max: 13
  pipeline_class: DicotPipeline
- species: pennycress
  mode: cylinder
  age_min: 2
  age_max: 14
  pipeline_class: DicotPipeline
- species: arabidopsis
  mode: multiplant cylinder
  age_min: 2
  age_max: 14
  pipeline_class: MultipleDicotPipeline
- species: arabidopsis
  mode: cylinder
  age_min: 2
  age_max: 14
  pipeline_class: DicotPipeline
- species: arabidopsis
  mode: plate
  age_min: 7
  age_max: 14
  pipeline_class: MultipleDicotPlatePipeline
- species: rice
  mode: cylinder
  age_min: 2
  age_max: 5
  pipeline_class: YoungerMonocotPipeline
- species: rice
  mode: cylinder
  age_min: 6
  age_max: 10
  pipeline_class: OlderMonocotPipeline
- species: wheat
  mode: cylinder
  age_min: 5
  age_max: 14
  pipeline_class: OlderMonocotPipeline
- species: sorghum
  mode: cylinder
  age_min: 3
  age_max: 14
  pipeline_class: DicotPipeline
