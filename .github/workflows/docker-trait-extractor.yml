# Build (and on main, push) the GHCR trait-extractor service image. Distinct from the PyPI
# library release (build.yml) and the test suite (ci.yml): this image and the library never
# trigger each other — there is no `release:` trigger here, and both event triggers are
# path-filtered to the image's inputs.
name: Docker Trait-Extractor Build and Push

on:
  push:
    branches: [main]
    paths:
      # The image bakes the `sleap_roots` library from source (COPY + editable install), so a
      # library-source change is an image-content change and must rebuild/republish the image.
      - "sleap_roots/**"
      - "trait_extractor/**"
      - "trait-extractor.Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/docker-trait-extractor.yml"
  pull_request:
    paths:
      # The image bakes the `sleap_roots` library from source (COPY + editable install), so a
      # library-source change is an image-content change and must rebuild/republish the image.
      - "sleap_roots/**"
      - "trait_extractor/**"
      - "trait-extractor.Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - ".github/workflows/docker-trait-extractor.yml"
  workflow_dispatch:

# Don't let two builds of the same ref race on the shared `latest`/`sha` tags.
concurrency:
  group: docker-trait-extractor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we actually push (skipped on pull_request builds, so PRs from
      # forks need no registry credentials).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Explicit service identity — NOT ${{ github.repository }}, which is the library's
          # package (ghcr.io/talmolab/sleap-roots).
          images: ghcr.io/talmolab/sleap-roots-trait-extractor
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: trait-extractor.Dockerfile
          # Build-only on PRs (validate the Dockerfile); build + push on main / dispatch.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the build commit so envelopes carry provenance.traits_code_sha (idempotency
          # key input). A runtime env in the Argo template still overrides it.
          build-args: |
            SRT_TRAITS_CODE_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Surface the pushed image digest so A4's Argo template can pin @sha256:… (A4 pins the
      # container per run so retries recompute an identical idempotency key).
      - name: Summarize pushed image
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### trait-extractor image"
            echo ""
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
