[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sleap-roots"
authors = [
    {name = "Elizabeth Berrigan", email = "eberrigan@salk.edu"},
    {name = "Lin Wang", email = "linwang@salk.edu"},
    {name = "Talmo Pereira", email = "talmo@salk.edu"}
]
description="Analysis tools for SLEAP-based plant root phenotyping."
requires-python = ">=3.10"
keywords = ["sleap", "plants", "roots", "phenotyping"]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "h5py",
    "attrs",
    "pandas",
    "matplotlib",
    "seaborn",
    "sleap-io>=0.0.11",
    "scikit-image",
    "shapely",
    "click>=8.0",
    "jinja2>=3.0",
    "scipy",
    "pywavelets>=1.5"
]
dynamic = ["version", "readme"]

# ---- uv dev group for contributors/CI ----
[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "black",
    "pydocstyle",
    "toml",
    "twine",
    "build",
    # Contract types for the trait_extractor service (dev/test/container only, NOT a
    # published runtime dependency). Requires Python >=3.11, so the marker keeps
    # `uv lock` resolving cleanly against the library's >=3.10 floor.
    "sleap-roots-contracts==0.1.0a3 ; python_version >= '3.11'",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.20",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-jupyter",
    "mike"
]

[tool.setuptools.dynamic]
version = {attr = "sleap_roots.__version__"}
readme = {file = ["README.md"], content-type="text/markdown"}

[tool.setuptools.packages.find]
include = ["sleap_roots"]  # Include only the sleap_roots package
# Exclude non-library dirs. `trait_extractor*` is belt-and-suspenders: the include
# allowlist already keeps the top-level trait_extractor service out of the wheel/sdist.
exclude = ["notebooks", "trait_extractor*"]
namespaces = false

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can `import trait_extractor` (the service
# package lives at the repo root and is intentionally excluded from the wheel).
pythonpath = ["."]

# ---- PyPI extras for end users who opt in ----
[project.optional-dependencies]
# Mirror of dependency-groups for pip compatibility
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "black",
    "pydocstyle",
    "toml",
    "twine",
    "build",
    "sleap-roots-contracts==0.1.0a3 ; python_version >= '3.11'",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.20",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocs-jupyter",
    "mike"
]
# Slim install profile for the trait_extractor container image: the contract types + pyyaml,
# WITHOUT the dev/docs tooling above. The image installs this via
# `uv sync --frozen --no-dev --extra extractor`. `sleap-roots-contracts` is marked
# `python_version >= '3.11'` to match the dev groups (contracts needs Python >=3.11; the library
# keeps its >=3.10 floor). `pyyaml` is declared explicitly because `trait_extractor` imports it
# directly (pipeline_chooser reads pipeline_selection.yaml) even though it also arrives
# transitively via sleap-io/contracts. This is a dev/test/container dependency set, never a
# published runtime dependency of `sleap-roots`.
extractor = [
    "sleap-roots-contracts==0.1.0a3 ; python_version >= '3.11'",
    "pyyaml"
]

[project.scripts]
sleap-roots = "sleap_roots.cli:main"

[project.urls]
Homepage = "https://github.com/talmolab/sleap-roots"
Repository = "https://github.com/talmolab/sleap-roots"

[tool.black]
line-length = 88
target-version = ["py310"]

[pydocstyle]
convention = "google"
match-dir = "sleap_roots"